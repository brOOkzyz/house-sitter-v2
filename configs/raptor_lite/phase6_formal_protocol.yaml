protocol_revision: 1
revision_reason: "pre-execution materialization of previously underspecified experimental cases; no formal results existed before revision."
output_root: results/raptor_lite/phase6_formal
artifact_requirements: [phase6_formal, frozen_head, protocol_hash, analysis_plan_hash, rq_id, condition, seed, analysis_cohort, confirmatory, ground_truth, manifest, reproducibility_hash]
materialized_inputs:
  rq1_cases_source: configs/raptor_lite/phase6_rq1_cases.json
  rq2_corpus_source: configs/raptor_lite/phase6_rq2_corpus.yaml
  rq3_seed_manifest_source: configs/raptor_lite/phase6_rq3_seed_manifest.json
