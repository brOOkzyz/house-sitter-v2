<svg xmlns="http://www.w3.org/2000/svg" width="820" height="257"><text x="10" y="25" font-size="18" font-weight="bold">RQ3 held-out outcomes (n=300)</text><text x="10" y="70" font-size="13">Mission completed</text><rect x="225" y="55" width="296.0" height="20" fill="#2878b5"/><text x="528.0" y="70" font-size="13">0.617</text><text x="10" y="108" font-size="13">Safe defer</text><rect x="225" y="93" width="105.6" height="20" fill="#2878b5"/><text x="337.6" y="108" font-size="13">0.220</text><text x="10" y="146" font-size="13">Safe blocked route</text><rect x="225" y="131" width="78.4" height="20" fill="#2878b5"/><text x="310.4" y="146" font-size="13">0.163</text><text x="10" y="184" font-size="13">Unexpected/system failure</text><rect x="225" y="169" width="0.0" height="20" fill="#2878b5"/><text x="232.0" y="184" font-size="13">0.000</text><text x="10" y="245" font-size="11">Mutually exclusive outcomes. Safe outcome is not synonymous with mission completion.</text></svg>